name: commit-policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: No AI assistant credited in commits or the description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/attribution.mjs check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
